[project]
name = "law-minister-attendance"
version = "1.0.0"
description = "AI-Powered Face Recognition Staff Attendance System for Law Minister's Office"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.6",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
    "opencv-python-headless>=4.8.0",
    "insightface>=0.7.3",
    "onnxruntime>=1.16.0",
    "httpx>=0.25.0",
    "jinja2>=3.1.0",
    "openpyxl>=3.1.0",
]

[project.scripts]
attendance = "backend.main:run"
