# Fly.io configuration for Law Minister Bot (standalone)
app = "law-minister-bot"
primary_region = "bom"

[build]
  dockerfile = "bot_service/Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/health"
  timeout = "5s"

[mounts]
  source = "lm_bot_data"
  destination = "/data"
